<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SW Live</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #2f81f7;
    --green: #3fb950; --red: #f85149; --gray: #8b949e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 16px;
  }
  .screen { width: 100%; max-width: 900px; }
  .hidden { display: none !important; }

  .topbar {
    width: 100%; max-width: 900px; display: flex; align-items: center; gap: 12px;
    padding: 12px 4px; margin-bottom: 8px;
  }
  .topbar h1 { font-size: 18px; font-weight: 600; }
  .topbar .spacer { flex: 1; }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 8px 14px; font-size: 14px; cursor: pointer;
  }
  button.ghost {
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 12px; font-size: 13px; cursor: pointer;
  }
  button.ghost:hover { color: var(--text); border-color: var(--muted); }

  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--gray); }
  .dot.live { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.off { background: var(--red); }

  /* password gate */
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 28px; margin-top: 12vh; text-align: center;
  }
  .card h2 { margin-bottom: 6px; }
  .card p { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
  input[type=password], input[type=url], input[type=text] {
    width: 100%; max-width: 340px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; font-size: 15px; margin-bottom: 12px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  .err { color: var(--red); font-size: 13px; min-height: 18px; margin-bottom: 8px; }

  /* player */
  #videoWrap {
    background: #000; border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; position: relative; aspect-ratio: 16 / 9;
  }
  #stream { width: 100%; height: 100%; object-fit: contain; display: block; }
  #overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(13,17,23,.7); color: var(--muted); font-size: 15px; backdrop-filter: blur(2px);
  }
  .hint { color: var(--muted); font-size: 12px; text-align: center; margin-top: 10px; line-height: 1.6; }
  .hint a { color: var(--accent); }

  /* settings modal */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px;
  }
  .modal .card { margin-top: 0; width: 100%; max-width: 420px; text-align: left; }
  .modal label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
  .modal .row { display: flex; gap: 8px; align-items: center; }
</style>
</head>
<body>

  <div class="topbar">
    <h1>🔴 SW Live</h1>
    <div class="spacer"></div>
    <span id="status" class="status hidden"><span id="dot" class="dot"></span><span id="statusText">offline</span></span>
    <button id="settingsBtn" class="ghost">Settings</button>
  </div>

  <!-- password gate -->
  <div id="gate" class="screen card">
    <h2>Private live stream</h2>
    <p>Enter the password to watch.</p>
    <input type="password" id="pwInput" placeholder="Password" autocomplete="off">
    <div class="err" id="pwErr"></div>
    <div><button id="unlockBtn">Watch</button></div>
  </div>

  <!-- player -->
  <div id="player" class="screen hidden">
    <div id="videoWrap">
      <img id="stream" alt="live stream">
      <div id="overlay" class="hidden">Connecting to stream…</div>
    </div>
    <p class="hint">
      Live from the broadcaster's PC · Stream ends when the PC is off.<br>
      Wrong link? Open <b>Settings</b> and paste the current tunnel URL.
    </p>
  </div>

  <!-- settings modal -->
  <div id="settingsModal" class="modal hidden">
    <div class="card">
      <h2>Stream settings</h2>
      <label for="urlInput">Stream source URL (from the broadcaster's tunnel)</label>
      <input type="url" id="urlInput" placeholder="https://xxxx.trycloudflare.com" spellcheck="false">
      <label for="pwInput2">Password (optional - prefill)</label>
      <input type="password" id="pwInput2" placeholder="Password" autocomplete="off">
      <div class="row">
        <button id="saveBtn">Save</button>
        <button id="cancelBtn" class="ghost">Cancel</button>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";
  var LS_URL = "swStreamUrl";
  var LS_TOKEN = "swToken";

  var gate = document.getElementById("gate");
  var player = document.getElementById("player");
  var streamImg = document.getElementById("stream");
  var overlay = document.getElementById("overlay");
  var statusEl = document.getElementById("status");
  var dotEl = document.getElementById("dot");
  var statusText = document.getElementById("statusText");
  var pwErr = document.getElementById("pwErr");
  var settingsModal = document.getElementById("settingsModal");

  function url()   { return localStorage.getItem(LS_URL) || ""; }
  function token() { return localStorage.getItem(LS_TOKEN) || ""; }

  /* Validate password against the stream server's /info endpoint. */
  function checkPassword(pw) {
    var u = url();
    if (!u) return Promise.resolve(false);
    return fetch(u + "/info?token=" + encodeURIComponent(pw), { cache: "no-store" })
      .then(function (r) { if (!r.ok) return false; return r.json().then(function (j) { return j.ok === true; }); })
      .catch(function () { return false; });
  }

  /* Poll /info to show live/offline status and auto-reconnect the player. */
  var missed = 0;
  function poll() {
    var u = url(), t = token();
    if (!u || !t) { setStatus("off", "offline"); return; }
    fetch(u + "/info?token=" + encodeURIComponent(t), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (j) {
        if (j.ok !== true) throw new Error("bad");
        missed = 0;
        var age = Date.now() / 1000 - j.updated;
        setStatus(age < 8 ? "live" : "off", age < 8 ? "LIVE" : "stale");
        if (age >= 8) reconnect();
      })
      .catch(function () {
        missed += 1;
        setStatus("off", "offline");
        if (missed >= 2) reconnect();   // stream dropped - reload it
      });
  }

  function reconnect() {
    if (!url() || !token()) return;
    var src = streamImg.src;
    streamImg.src = src.split("?")[0] + "?token=" + encodeURIComponent(token()) + "&r=" + Date.now();
  }

  function setStatus(cls, text) {
    dotEl.className = "dot " + cls;
    statusText.textContent = text;
  }

  function startPlayer() {
    gate.classList.add("hidden");
    player.classList.remove("hidden");
    statusEl.classList.remove("hidden");
    streamImg.src = url() + "/stream?token=" + encodeURIComponent(token());
    poll();
    setInterval(poll, 5000);
  }

  /* ---------- password gate ---------- */
  document.getElementById("unlockBtn").addEventListener("click", unlock);
  document.getElementById("pwInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") unlock();
  });

  function unlock() {
    var pw = document.getElementById("pwInput").value.trim();
    if (!pw) { pwErr.textContent = "Enter a password."; return; }
    pwErr.textContent = "Checking…";
    checkPassword(pw).then(function (ok) {
      if (ok) {
        localStorage.setItem(LS_TOKEN, pw);
        pwErr.textContent = "";
        startPlayer();
      } else {
        pwErr.textContent = "Wrong password, or the stream is offline. Check the URL in Settings.";
        document.getElementById("pwInput").select();
      }
    });
  }

  /* ---------- settings ---------- */
  document.getElementById("settingsBtn").addEventListener("click", function () {
    document.getElementById("urlInput").value = url();
    document.getElementById("pwInput2").value = "";
    settingsModal.classList.remove("hidden");
  });
  document.getElementById("cancelBtn").addEventListener("click", function () {
    settingsModal.classList.add("hidden");
  });
  document.getElementById("saveBtn").addEventListener("click", function () {
    var u = document.getElementById("urlInput").value.trim().replace(/\/+$/, "");
    var pw = document.getElementById("pwInput2").value.trim();
    settingsModal.classList.add("hidden");
    if (!u) { pwErr.textContent = "URL required - open Settings and paste it."; return; }
    if (u !== url()) {            // new stream source -> ask for password again
      localStorage.removeItem(LS_TOKEN);
      localStorage.setItem(LS_URL, u);
      gate.classList.remove("hidden");
      player.classList.add("hidden");
      statusEl.classList.add("hidden");
      if (pw) document.getElementById("pwInput").value = pw;
      document.getElementById("pwInput").focus();
      pwErr.textContent = "";
    }
  });

  /* ---------- boot ---------- */
  if (!url()) {
    document.getElementById("settingsBtn").click();   // first visit -> set URL
  }
  if (token() && url()) {
    // Already unlocked before -> go straight to the player.
    startPlayer();
  }
})();
</script>
</body>
</html>
